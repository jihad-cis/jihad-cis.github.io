<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d0b">
<title>404 — الصفحة غير موجودة | Page Not Found</title>
<style>
  :root{--bg:#080d0b;--panel:#101915;--ink:#f3f6ef;--muted:#a8b4aa;--lime:#c9f27a;--line:rgba(235,246,235,.15)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 25% 20%,rgba(201,242,122,.08),transparent 42%),var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif;text-align:center}
  .box{max-width:500px;padding:40px 30px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
  .code{font:700 64px monospace;color:var(--lime);line-height:1;margin-bottom:10px}
  h1{margin:0 0 10px;font-size:22px}
  p{margin:0 0 18px;color:var(--muted);line-height:1.9}
  a{display:inline-block;padding:12px 24px;border-radius:999px;background:var(--lime);color:#10170d;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main class="box">
  <div class="code">404</div>
  <h1>هذه المساحة المعمارية غير موجودة</h1>
  <p>الرابط المطلوب غير متاح أو تم نقله. يمكنك العودة إلى الواجهة الرئيسية لاستكشاف العوالم الستة.</p>
  <p dir="ltr" style="font-size:13px">The requested route could not be found. Return to the main architectural workspace.</p>
  <a href="/">العودة للرئيسية / Back to Home</a>
</main>
</body>
</html>
